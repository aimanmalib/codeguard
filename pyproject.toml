[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-llm"
version = "1.0.0"
description = "Multi-agent code review for any OpenAI-compatible LLM (OpenAI, OpenRouter, Ollama, Groq, ...)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Muhammad Aiman"}]
keywords = ["code-review", "ai", "agents", "llm", "openai", "automation", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aimanmalib/codeguard"
Repository = "https://github.com/aimanmalib/codeguard"
Issues = "https://github.com/aimanmalib/codeguard/issues"

[project.scripts]
codeguard = "codeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit", "integration", "slow"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Explicit rule set so new ruff releases (which widen the default set) don't
# break CI unexpectedly.
select = ["E", "F", "I", "UP", "B"]
